name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project files
        run: |
          flutter create --platforms=android,web --project-name my_farm_accounts .
          git checkout -- lib/main.dart pubspec.yaml test analysis_options.yaml README.md
          sed -i 's/applicationId = "com.example.my_farm_accounts"/applicationId = "com.mohamedrizk.myfarmaccounts"/' android/app/build.gradle.kts || true
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts || true
          sed -i 's/android:label="my_farm_accounts"/android:label="حسابات مزرعتي - My Farm Accounts"/' android/app/src/main/AndroidManifest.xml || true

      - name: Get dependencies
        run: flutter pub get

      - name: Smoke test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK signature
        shell: bash
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-farm-accounts-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
